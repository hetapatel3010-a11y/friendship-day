<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To My Best Buddy ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
background:linear-gradient(-45deg,#ffd6e7,#ffc2d1,#ffb3c6,#ffe5ec);
background-size:400% 400%;
animation:bg 12s ease infinite;
transition:opacity .8s;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Floating Hearts */

.heart{
position:absolute;
animation:float linear infinite;
opacity:.8;
user-select:none;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(110vh) rotate(0deg);
opacity:0;
}

15%{
opacity:1;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}

/* Glass Card */

.card{

width:430px;

padding:45px;

text-align:center;

background:rgba(255,255,255,.28);

backdrop-filter:blur(18px);

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.15);

animation:pop 1s;

}

@keyframes pop{

0%{
transform:scale(.8);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

h1{

font-size:38px;

color:#d6336c;

margin-bottom:20px;

}

p{

font-size:18px;

line-height:1.8;

color:#555;

margin-bottom:35px;

animation:fade 2s infinite;

}

@keyframes fade{

0%,100%{
opacity:1;
}

50%{
opacity:.7;
}

}

button{

padding:15px 38px;

font-size:18px;

font-weight:bold;

border:none;

border-radius:40px;

background:#ff4d6d;

color:white;

cursor:pointer;

transition:.4s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 10px 25px rgba(255,77,109,.4);

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ To My Best Buddy ❤️</h1>

<p>

I made something special just for you. 💖

Every click ahead holds one of our beautiful memories.

I hope this little surprise brings a smile to your face.

</p>

<button onclick="openPage()">

🎁 Open My Surprise

</button>

</div>

<script>

/* Heart Colors */

const colors=[
"#ff1744",
"#ff4d6d",
"#ff69b4",
"#ff85c2",
"#ff1493",
"#ffb6c1"
];

/* Create Hearts */

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.color=colors[Math.floor(Math.random()*colors.length)];

heart.style.animationDuration=(6+Math.random()*6)+"s";

heart.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(heart);

}

/* Open Next Page */

function openPage(){

document.body.style.opacity="0";

setTimeout(()=>{

window.location.href="page2.html";

},800);

}

</script>

</body>

</html>
