<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ffd6e7,#ffc2d1,#ffb3c6,#ffe5ec);
background-size:400% 400%;
animation:bg 12s ease infinite;
position:relative;
}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* Floating Hearts */

.heart{
position:absolute;
animation:float linear infinite;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(110vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

/* Main Card */

.card{

width:90%;
max-width:700px;

background:rgba(255,255,255,.28);

backdrop-filter:blur(18px);

padding:45px;

border-radius:30px;

text-align:center;

box-shadow:0 15px 35px rgba(0,0,0,.18);

animation:zoom 1s;

}

@keyframes zoom{

from{
opacity:0;
transform:scale(.7);
}

to{
opacity:1;
transform:scale(1);
}

}

.bigHeart{

font-size:100px;

animation:beat 1s infinite;

}

@keyframes beat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.25);

}

}

h1{

margin-top:20px;

font-size:42px;

color:#d6336c;

}

p{

margin-top:25px;

font-size:22px;

line-height:1.8;

color:#555;

}

.footer{

margin-top:35px;

font-size:20px;

color:#d6336c;

font-weight:bold;

}

/* Confetti */

.confetti{

position:absolute;

width:10px;

height:10px;

animation:fall 4s linear forwards;

}

@keyframes fall{

to{

transform:translateY(110vh) rotate(720deg);

opacity:0;

}

}

</style>

</head>

<body>

<div class="card">

<div class="bigHeart">
❤️
</div>

<h1>Happy Friendship Day</h1>

<p>

Every memory with you is a treasure. 💖

Thank you for being such an amazing friend.

No matter where life takes us,

our friendship will always remain special.

May we continue making beautiful memories together.

😊❤️

</p>

<div class="footer">

Made with ❤️ by Darshan

</div>

</div>

<script>

/* Floating Hearts */

const colors=[

"#ff1744",

"#ff4d6d",

"#ff69b4",

"#ff85c2",

"#ff1493",

"#ffb6c1"

];

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.color=colors[Math.floor(Math.random()*colors.length)];

heart.style.animationDuration=(5+Math.random()*6)+"s";

heart.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(heart);

}

/* Confetti */

for(let i=0;i<200;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.background=`hsl(${Math.random()*360},100%,60%)`;

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},4000);

}

</script>

</body>
</html>
