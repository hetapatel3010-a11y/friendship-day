<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

background:linear-gradient(-45deg,#ffd6e7,#ffc2d1,#ffb3c6,#ffe5ec);

background-size:400% 400%;

animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* Floating Hearts */

.heart{

position:absolute;

animation:float linear infinite;

opacity:.8;

pointer-events:none;

}

@keyframes float{

0%{

transform:translateY(110vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

/* Letter */

.card{

width:90%;

max-width:700px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

text-align:center;

}

h1{

color:#d6336c;

margin-bottom:20px;

font-size:40px;

}

#message{

font-size:22px;

line-height:1.8;

color:#444;

min-height:280px;

white-space:pre-line;

}

button{

margin-top:25px;

padding:15px 35px;

background:#ff4d6d;

color:white;

border:none;

border-radius:40px;

font-size:18px;

cursor:pointer;

display:none;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

</style>

</head>

<body>

<div class="card">

<h1>💌 Happy Friendship Day ❤️</h1>

<div id="message"></div>

<button id="nextBtn" onclick="window.location.href='page4.html'">

One Last Surprise ❤️

</button>

</div>

<script>

const text=`Dear Best Buddy,

Happy Friendship Day! ❤️

Thank you for every laugh, every smile, and every unforgettable memory we've shared.

You have made ordinary days feel extraordinary, and every moment spent together has become a memory I truly cherish.

No matter where life takes us, I hope our friendship continues to grow stronger with every passing day.

Thank you for being such an amazing part of my life.

❤️ Happy Friendship Day ❤️`;

let i=0;

function typing(){

if(i<text.length){

document.getElementById("message").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,35);

}

else{

document.getElementById("nextBtn").style.display="inline-block";

}

}

typing();

const colors=[
"#ff1744",
"#ff4d6d",
"#ff69b4",
"#ff85c2",
"#ff1493",
"#ffb6c1"
];

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.color=colors[Math.floor(Math.random()*colors.length)];

heart.style.animationDuration=(6+Math.random()*6)+"s";

heart.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
